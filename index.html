<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 카페 - 주문서</title>
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- [페이지 상단] 카페 헤더 -->
    <header class="header">
        <div class="logo" style="font-size: 3rem;">☕</div>
        <h1>바이브 카페</h1>
        <p class="subtitle">당신의 하루에 바이브를 더하다</p>

        <!-- [탭 메뉴] 주문하기 / 주문 내역 -->
        <nav class="tab-menu" aria-label="메인 탭 메뉴">
            <button type="button" id="tab-order" class="tab-button active">☕ 주문하기</button>
            <button type="button" id="tab-history" class="tab-button">
                📋 주문 내역 <span id="order-badge" class="order-badge">0</span>
            </button>
        </nav>
    </header>

    <!-- [메인 콘텐츠] 탭 내용 영역 -->
    <main>
        <!-- 탭 1: 주문하기 화면 -->
        <div id="tab-content-order" class="tab-content">
            <form id="order-form" novalidate>
                <!-- 1. 주문자 이름 (필수 입력) -->
                <section class="form-group">
                    <label for="customer-name">이름</label>
                    <input type="text" id="customer-name" name="customerName" required placeholder="이름을 입력하세요">
                </section>

            <!-- 2. 전화번호 -->
            <section class="form-group">
                <label for="customer-phone">전화번호</label>
                <input type="tel" id="customer-phone" name="customerPhone" placeholder="010-0000-0000">
            </section>

            <!-- 3. 메뉴 선택 (드롭다운) -->
            <section class="form-group">
                <label for="beverage-select">메뉴 선택</label>
                <select id="beverage-select" name="beverage">
                    <option value="" data-price="0">-- 메뉴를 선택하세요 --</option>
                    <optgroup label="커피 & 라떼">
                        <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
                        <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
                        <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
                        <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
                        <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
                    </optgroup>
                    <optgroup label="에이드류">
                        <option value="lemon-ade" data-price="4800">레몬에이드 (4,800원)</option>
                        <option value="grapefruit-ade" data-price="4800">자몽에이드 (4,800원)</option>
                        <option value="cheongpo-ade" data-price="4800">청포도에이드 (4,800원)</option>
                        <option value="ulbaksa" data-price="3000">얼박사 (3,000원)</option>
                    </optgroup>
                    <optgroup label="빵류 (베이커리)">
                        <option value="salt-bread" data-price="3200">소금빵 (3,200원)</option>
                        <option value="croissant" data-price="3500">크루아상 (3,500원)</option>
                        <option value="bagel" data-price="3800">플레인 베이글 (3,800원)</option>
                    </optgroup>
                </select>
            </section>

            <!-- 4. 사이즈 선택 (라디오 버튼) -->
            <section class="form-group">
                <span class="group-label">사이즈</span>
                <div>
                    <input type="radio" id="size-s" name="size" value="S" data-price="0">
                    <label for="size-s">S (+0원)</label>
                </div>
                <div>
                    <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
                    <label for="size-m">M (+500원)</label>
                </div>
                <div>
                    <input type="radio" id="size-l" name="size" value="L" data-price="1000">
                    <label for="size-l">L (+1,000원)</label>
                </div>
            </section>

            <!-- 5. 추가 옵션 (체크박스) -->
            <section class="form-group">
                <span class="group-label">추가 옵션</span>
                <div>
                    <input type="checkbox" id="opt-shot" name="options" value="shot" data-price="500">
                    <label for="opt-shot">샷 추가 (+500원)</label>
                </div>
                <div>
                    <input type="checkbox" id="opt-cream" name="options" value="cream" data-price="500">
                    <label for="opt-cream">크림 추가 (+500원)</label>
                </div>
                <div>
                    <input type="checkbox" id="opt-syrup" name="options" value="syrup" data-price="300">
                    <label for="opt-syrup">시럽 추가 (+300원)</label>
                </div>
                <div>
                    <input type="checkbox" id="opt-decaf" name="options" value="decaf" data-price="0">
                    <label for="opt-decaf">디카페인 (+0원)</label>
                </div>
                 <div>
                    <input type="checkbox" id="opt-honey" name="options" value="honey" data-price="500">
                    <label for="opt-honey">꿀 추가 (+500원)</label>
                </div>
            </section>

            <!-- 6. 수량 -->
            <section class="form-group">
                <label for="quantity">수량</label>
                <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
            </section>

            <!-- 7. 요청사항 -->
            <section class="form-group">
                <label for="requests">요청사항</label>
                <textarea id="requests" name="requests" rows="4" placeholder="기타 요청사항을 입력해주세요."></textarea>
            </section>

            <!-- 8. 예상 금액 표시 영역 -->
            <div id="price-display" class="price-display">
                예상 금액: <span id="total-price">0</span>원
            </div>

            <!-- 9. 주문하기 버튼 및 10. 다시 작성 버튼 -->
            <div class="button-group">
                <button type="submit" id="submit-button">주문하기</button>
                <button type="reset" id="reset-button">다시 작성</button>
            </div>
        </form>

        <!-- 11. 주문 확인 메시지 표시 영역 (초기 상태 숨김) -->
        <div id="order-confirmation" class="order-confirmation" hidden></div>
        </div>

        <!-- 탭 2: 지금까지 접수된 주문 내역 화면 (초기에는 hidden 클래스로 숨김) -->
        <div id="tab-content-history" class="tab-content hidden">
            <!-- 주문 카드 목록 컨테이너 -->
            <div id="orders-list" class="orders-list"></div>

            <!-- 주문이 없을 때 안내 메시지 -->
            <div id="empty-history" class="empty-history">
                아직 주문 내역이 없어요 ☕
            </div>

            <!-- 주문 통계 및 전체 삭제 버튼 영역 -->
            <div id="history-summary" class="history-summary hidden">
                <p id="total-history-amount" class="total-history-amount">총 주문 금액: 0원 (0건)</p>
                <button type="button" id="clear-history-button" class="clear-history-button">내역 모두 지우기</button>
            </div>
        </div>
    </main>

    <!-- Supabase JS v2 CDN 라이브러리 연결 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 외부 자바스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
